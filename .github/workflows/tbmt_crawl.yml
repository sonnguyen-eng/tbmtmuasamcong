name: Daily TBMT Bot Processor

on:
  schedule:
    - cron: '30 0 * * *' # Chạy tự động vào 07:30 sáng hàng ngày (giờ VN)
  workflow_dispatch:   # Cho phép kích hoạt chạy thủ công từ giao diện GitHub

jobs:
  run-tbmt-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get Last SCHEDULED Workflow Run Timestamp
        id: last_run
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'schedule',
                status: 'success',
                per_page: 5
              });
              
              let lastScheduledRunTime = '';
              const scheduledRuns = runs.data.workflow_runs || [];
              
              if (context.eventName === 'schedule' && scheduledRuns.length > 1) {
                lastScheduledRunTime = scheduledRuns[1].created_at;
              } else if (scheduledRuns.length > 0) {
                lastScheduledRunTime = scheduledRuns[0].created_at;
              }
              
              core.setOutput('last_run_timestamp', lastScheduledRunTime);
              console.log(`Mốc thời gian chạy tự động gần nhất: ${lastScheduledRunTime}`);
            } catch (error) {
              console.log(`Lỗi khi lấy timestamp: ${error.message}. Sẽ lấy mặc định 24h trước.`);
              core.setOutput('last_run_timestamp', '');
            }

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager google-genai

      - name: Execute TBMT Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          LAST_RUN_TIMESTAMP: ${{ steps.last_run.outputs.last_run_timestamp }}
        run: python crawl_tbmt.py
