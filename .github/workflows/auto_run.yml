name: Auto Crawl TBMT TBYT & PACS

on:
  schedule:
    # Chạy tự động lúc 06:00 sáng và 20:30 tối hàng ngày (giờ Việt Nam UTC+7)
    - cron: '0 23 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Tải mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt trình duyệt Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lấy mốc thời gian lần chạy tự động thành công gần nhất
        id: get_last_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/auto_run.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty')
          echo "last_run=$LAST_RUN" >> $GITHUB_OUTPUT
          echo "Mốc lịch chạy tự động TBMT thành công gần nhất: $LAST_RUN"

      - name: Chạy BOT TBMT (Bước 1 - Quét, Lọc Trùng GSheet, Phân Tích AI & Gửi Email)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          LAST_RUN_TIMESTAMP: ${{ steps.get_last_run.outputs.last_run }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python main_bot.py

      - name: Sync to Google Sheets (Bước 2 - Ghi dữ liệu mới vào tab TBMT)
        if: always()
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python sync_to_gsheet.py TBMT
