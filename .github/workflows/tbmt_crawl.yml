name: Auto Daily TBMT Scanner Workflow

on:
  workflow_dispatch:
  schedule:
    # 13:00 UTC = 20:00 tối Giờ Việt Nam (UTC+7)
    - cron: '0 13 * * *'

jobs:
  run-tbmt-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager google-genai openpyxl google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Execute TBMT Crawler Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python -u crawl_tbmt.py
