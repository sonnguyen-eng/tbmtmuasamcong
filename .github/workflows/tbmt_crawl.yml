name: Crawl TBMT Y Te Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Chạy tự động hàng ngày vào 00:00 UTC (7:00 AM giờ VN)

jobs:
  crawl_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium webdriver-manager google-genai

      - name: Run Crawl & Analysis Script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python crawl_tbmt.py
