name: Tu Dong Quet Thau

on:
  schedule:
    - cron: '0 1 * * *' # Chạy tự động lúc 08:00 AM giờ Việt Nam hàng ngày
  workflow_dispatch: # Cho phép nhấn chạy thủ công bất kỳ lúc nào

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện cần thiết
        run: pip install requests google-genai

      - name: Chạy chương trình tìm thầu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python crawl_bidding.py
