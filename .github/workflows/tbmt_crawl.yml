name: Auto Crawl TBMT Hang Ngay

on:
  schedule:
    # Chạy tự động lúc 08:00 sáng và 16:30 chiều giờ Việt Nam (01:00 và 09:30 UTC)
    - cron: '0 1 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  crawl-tbmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Tải mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt trình duyệt Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager google-genai gspread google-auth

      - name: Lấy mốc thời gian lần chạy tự động (schedule) thành công gần nhất
        id: get_last_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_RUN=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/workflows/tbmt_crawl.yml/runs?event=schedule&status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')
          echo "last_run=$LAST_RUN" >> $GITHUB_OUTPUT
          echo "Mốc lịch chạy tự động TBMT thành công gần nhất: $LAST_RUN"

      - name: Chạy Bot TBMT (Bước 1 - Quét & Phân tích AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          LAST_RUN_TIMESTAMP: ${{ steps.get_last_run.outputs.last_run }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python crawl_tbmt.py

      - name: Sync to Google Sheets (Bước 2 - Ghi dữ liệu mới không trùng)
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python sync_to_gsheet.py TBMT
